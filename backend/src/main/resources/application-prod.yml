# Production profile (SPRING_PROFILES_ACTIVE=prod). Schema changes go through Flyway only.
spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  shutdown: graceful
  # Behind the nginx proxy the client IP arrives in X-Forwarded-For (needed for per-IP rate limits).
  # Only safe while the backend port is not reachable except through the proxy.
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:framework}
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  level:
    root: INFO
