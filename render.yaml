# Render Blueprint for the Classops backend (Spring Boot). The frontend is deployed on Vercel.
# PostgreSQL stays on Neon and Redis on Upstash (both external): enter their values in the Render dashboard
# when the Blueprint is created. This keeps the Blueprint to one Render service.
services:
  - type: web
    name: classops-api
    runtime: docker
    region: singapore # same region as the Neon database (ap-southeast-1) to keep DB latency low
    plan: free # free instances spin down when idle; use "starter" or higher for production
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    autoDeploy: true
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_URL # jdbc:postgresql://<neon-host>/<db>?sslmode=require
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FIREBASE_PROJECT_ID
        value: tuition-management-syste-2d320
      - key: CORS_ALLOWED_ORIGINS # your Vercel URL(s), comma separated, e.g. https://classops.vercel.app
        sync: false
      # External Redis (e.g. Upstash, free tier) so the Blueprint uses a single Render slot. Copy the values from the
      # Upstash database page: endpoint host, port (usually 6379) and password. TLS is required there.
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        value: "6379"
      - key: REDIS_PASSWORD
        sync: false
      - key: REDIS_SSL
        value: "true"
